            college: '',
            gender: ''
        };

        let notifications = [];
        let notifPanelOpen = false;

        let isAdmin = localStorage.getItem('nku-forum-admin') === 'true';
        const ADMIN_PASSWORD = 'nkuadmin';
        let announcements = [];
        let likedCommentIds = JSON.parse(localStorage.getItem('nku-forum-liked-comments') || '[]');

        // ==================== 工具函数 ====================
        function formatTime(isoString) {
            if (!isoString) return '刚刚';
            const date = new Date(isoString);
            const now = new Date();
            const diff = (now - date) / 1000;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            if (diff < 604800) return Math.floor(diff / 86400) + '天前';
            return date.toLocaleDateString('zh-CN');
        }

        function getGenderSymbol(gender) {
            if (gender === '男') return '♂';
            if (gender === '女') return '♀';
            return '';
        }

        function getAuthorId() {
            if (userProfile.studentId && userProfile.studentId.trim()) {
                return 'stu-' + userProfile.studentId.trim();
            }
            return currentUserId;
        }

        function saveLocalProfile() {
            localStorage.setItem('nku-forum-userProfile', JSON.stringify(userProfile));
        }

        function loadLocalProfile() {
            try {
                const saved = localStorage.getItem('nku-forum-userProfile');
                if (saved) userProfile = JSON.parse(saved);
            } catch (e) { console.warn('读取本地个人信息失败', e); }
        }

        function getFavoritesKey() {
            return 'nku-forum-favorites-' + getAuthorId();
        }

        function loadFavorites() {
            try {
                favoritedPostIds = JSON.parse(localStorage.getItem(getFavoritesKey()) || '[]');
            } catch (e) { favoritedPostIds = []; }
        }

        function saveFavorites() {
            localStorage.setItem(getFavoritesKey(), JSON.stringify(favoritedPostIds));
        }

        function toggleFavorite(postId) {
            if (favoritedPostIds.includes(postId)) {
                favoritedPostIds = favoritedPostIds.filter(id => id !== postId);
                showToast('已取消收藏', 'info');
            } else {
                favoritedPostIds.push(postId);
                showToast('已收藏', 'success');
            }
            saveFavorites();
            renderPosts();
        }

        function startReply(commentId, authorName, postId) {
            replyingToCommentId = commentId;
            replyingToPostId = postId;
            replyingToAuthorName = authorName;
            const input = document.getElementById('commentInput');
            if (input) {
                input.placeholder = `回复 @${authorName || '匿名'}:`;
                input.focus();
            }
        }

        function clearReplyState() {
            replyingToCommentId = null;
            replyingToPostId = null;
            replyingToAuthorName = null;
            const input = document.getElementById('commentInput');
            if (input) {
                input.placeholder = '写下你的评论...';
            }
        }

        // ==================== 数据加载 ====================
        async function loadPosts() {
            isLoading = true;
            loadError = null;
            renderPosts();

            const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .gt('created_at', thirtyDaysAgo)
                    .order('created_at', { ascending: false });

                if (error) {
                    throw error;
                }

                posts = (data || []).map(p => ({
                    id: p.id,
                    author: p.author_name,
                    avatar: p.author_name ? p.author_name.charAt(0) : '匿',
                    avatarColor: 'bg-gradient-to-br from-purple-500 to-indigo-600 text-white',
                    category: p.category,
                    title: p.title,
                    content: p.content,
                    time: formatTime(p.created_at),
                    likes: p.likes || 0,
                    views: p.views || 0,
                    comments: 0,
                    liked: likedPostIds.includes(p.id),
                    isTop: false,
                    author_id: p.author_id,
                    author_college: p.author_college || '',
                    author_gender: p.author_gender || '',
                    is_admin: p.is_admin || false,
                    created_at: p.created_at,
                    commentList: []
                }));

                await loadComments();
                renderHotTopics();
                renderLeaderboard();
            } catch (err) {
                console.error('加载帖子失败', err);
                loadError = err;
            } finally {
                isLoading = false;
                renderPosts();
            }
        }

        async function loadComments() {
            const { data, error } = await supabaseClient
                .from('comments')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('加载评论失败', error);
                return;
            }

            allComments = (data || []).map(c => ({
                id: c.id,
                post_id: c.post_id,
                parent_id: c.parent_id || null,
                reply_to_name: c.reply_to_name || '',
                author: c.author_name,
                author_id: c.author_id,
                author_college: c.author_college || '',
                author_gender: c.author_gender || '',
                is_admin: c.is_admin || false,
                content: c.content,
                likes: c.likes || 0,
                liked: likedCommentIds.includes(c.id),
                time: formatTime(c.created_at)
            }));

            posts.forEach(post => {
                post.commentList = allComments.filter(c => c.post_id === post.id);
                post.comments = post.commentList.length;
            });
        }

        async function loadAnnouncements() {
            const { data, error } = await supabaseClient
                .from('announcements')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('加载公告失败', error);
                return;
            }
            announcements = data || [];
            renderAnnouncements();
        }

        // ==================== 实时订阅 ====================
        function setupRealtime() {
            if (!supabaseClient) return;
            supabaseClient
                .channel('public:posts')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => {
                    loadPosts();
                })
                .subscribe();

            supabaseClient
                .channel('public:comments')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, (payload) => {
                    const commentedPost = posts.find(p => p.id === payload.new.post_id);
                    // 通知帖子作者
                    if (commentedPost && commentedPost.author_id === getAuthorId()) {
                        addNotification('reply', commentedPost);
                    }
                    // 通知被回复的评论作者
                    if (payload.new.parent_id) {
                        const parentComment = allComments.find(c => c.id === payload.new.parent_id);
                        if (parentComment && parentComment.author_id === getAuthorId()) {
                            addNotification('reply', commentedPost, '回复了你在');
                        }
                    }
                    loadComments().then(() => {
                        renderPosts();
                        renderHotTopics();
                        renderLeaderboard();
                        // 如果正在查看该帖子详情，刷新详情
                        const detailModal = document.getElementById('detailModal');
                        if (!detailModal.classList.contains('hidden')) {
                            openPostDetail(payload.new.post_id);
                        }
                    });
                })
                .subscribe();

            supabaseClient
                .channel('public:announcements')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, () => {
                    loadAnnouncements();
                })
                .subscribe();
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            loadLocalProfile();
            loadFavorites();
            setupEventListeners();
            loadPosts().then(() => {
                renderNotifications();
                updateNavAvatar();
                renderLeaderboard();
                loadAnnouncements();
                setupRealtime();
            });
        });

        function setupEventListeners() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('active', 'bg-purple-700', 'text-white');
                        b.classList.add('text-gray-600', 'hover:bg-gray-100');
                    });
                    e.target.classList.add('active', 'bg-purple-700', 'text-white');
                    e.target.classList.remove('text-gray-600', 'hover:bg-gray-100');
                    currentFilter = e.target.dataset.filter;
                    currentPage = 1;
                    renderPosts();
                });
            });

            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.sidebar-item').forEach(i => {
                        i.classList.remove('active');
                        i.classList.add('text-gray-600');
                    });
                    item.classList.add('active');
                    item.classList.remove('text-gray-600');
                    currentCategory = item.dataset.cat;
                    currentPage = 1;
                    renderPosts();
                });
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                currentPage = 1;
                renderPosts();
            });

            document.getElementById('filterCollege').addEventListener('change', (e) => {
                filterCollege = e.target.value;
                currentPage = 1;
                renderPosts();
            });
            document.getElementById('filterFavorites').addEventListener('change', (e) => {
                filterFavorites = e.target.checked;
                currentPage = 1;
                renderPosts();
            });
        }

        function resetFilters() {
            filterCollege = '';
            filterFavorites = false;
            currentPage = 1;
            document.getElementById('filterCollege').value = '';
            document.getElementById('filterFavorites').checked = false;
            renderPosts();
        }

        // ==================== 渲染 ====================
        function getFilteredPosts() {
            let result = [...posts];
            if (currentCategory !== 'all') {
                result = result.filter(p => p.category === currentCategory);
            }
            if (filterCollege) {
                result = result.filter(p => p.author_college === filterCollege);
            }
            if (filterFavorites) {
                result = result.filter(p => favoritedPostIds.includes(p.id));
            }
            if (searchQuery) {
                result = result.filter(p =>
                    p.title.toLowerCase().includes(searchQuery) ||
                    p.content.toLowerCase().includes(searchQuery) ||
                    (p.author_college || '').toLowerCase().includes(searchQuery)
                );
            }
            if (currentFilter === 'hot') {
                result.sort((a, b) => b.likes - a.likes);
            } else if (currentFilter === 'new') {
                result.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            } else if (currentFilter === 'top') {
                result.sort((a, b) => b.views - a.views);
            }
            return result;
        }

        function renderPosts() {
            const container = document.getElementById('postList');
            const paginationContainer = document.getElementById('pagination');

            if (isLoading) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm p-12 text-center">
                        <i class="fas fa-spinner fa-spin text-4xl text-purple-300 mb-3"></i>
                        <p class="text-gray-500">正在加载帖子...</p>
                    </div>
                `;
                paginationContainer.innerHTML = '';
                return;
            }

            if (loadError) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm p-12 text-center">
                        <i class="fas fa-exclamation-circle text-4xl text-red-300 mb-3"></i>
                        <p class="text-gray-500 mb-2">加载失败，请检查网络</p>
                        <button onclick="loadPosts()" class="px-4 py-2 bg-purple-700 text-white rounded-xl text-sm hover:bg-purple-800 transition-colors">重新加载</button>
                    </div>
                `;
                paginationContainer.innerHTML = '';
                return;
            }

            const filtered = getFilteredPosts();
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm p-12 text-center">
                        <i class="fas fa-inbox text-4xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500">没有找到相关帖子</p>
                    </div>
                `;
                paginationContainer.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(filtered.length / postsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * postsPerPage;
            const pagePosts = filtered.slice(start, start + postsPerPage);

            container.innerHTML = pagePosts.map(post => createPostHTML(post)).join('');
            renderPagination(currentPage, totalPages);
        }

        function renderPagination(current, total) {
            const container = document.getElementById('pagination');
            if (total <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';

            // 上一页
            html += `
                <button onclick="goToPage(${current - 1})" ${current === 1 ? 'disabled' : ''}
                    class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${current === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-100 bg-white border border-gray-200'}">
                    上一页
                </button>
            `;

            // 页码
            const maxVisible = 5;
            let startPage = Math.max(1, current - Math.floor(maxVisible / 2));
            let endPage = Math.min(total, startPage + maxVisible - 1);
            if (endPage - startPage + 1 < maxVisible) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<button onclick="goToPage(1)" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 bg-white border border-gray-200">1</button>`;
                if (startPage > 2) html += `<span class="px-2 text-gray-400">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `
                    <button onclick="goToPage(${i})"
                        class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${i === current ? 'bg-purple-700 text-white' : 'text-gray-600 hover:bg-gray-100 bg-white border border-gray-200'}">
                        ${i}
                    </button>
                `;
            }

            if (endPage < total) {
                if (endPage < total - 1) html += `<span class="px-2 text-gray-400">...</span>`;
                html += `<button onclick="goToPage(${total})" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 bg-white border border-gray-200">${total}</button>`;
            }

            // 下一页
            html += `
                <button onclick="goToPage(${current + 1})" ${current === total ? 'disabled' : ''}
                    class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${current === total ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-100 bg-white border border-gray-200'}">
                    下一页
                </button>
            `;

            // 跳转输入框
            html += `
                <div class="flex items-center gap-2 ml-2">
                    <span class="text-sm text-gray-500">跳至</span>
                    <input type="number" id="jumpPageInput" min="1" max="${total}" value="${current}"
                        class="w-14 px-2 py-1.5 text-center text-sm border border-gray-200 rounded-lg outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200"
                        onkeypress="if(event.key==='Enter') jumpToPage()">
                    <button onclick="jumpToPage()" class="px-3 py-1.5 text-sm text-purple-600 hover:bg-purple-50 rounded-lg transition-colors border border-purple-200">跳转</button>
                </div>
            `;

            container.innerHTML = html;
        }

        function goToPage(page) {
            const filtered = getFilteredPosts();
            const totalPages = Math.ceil(filtered.length / postsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderPosts();
            document.getElementById('postList').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function jumpToPage() {
            const input = document.getElementById('jumpPageInput');
            const page = parseInt(input.value, 10);
            if (isNaN(page)) return;
            goToPage(page);
        }

        function renderHotTopics() {
            const container = document.getElementById('hotTopics');
            const topPosts = [...posts].sort((a, b) => b.likes - a.likes).slice(0, 3);
            if (topPosts.length === 0) {
                container.innerHTML = `
                    <div class="px-3 py-4 text-center text-gray-400 text-sm">
                        <i class="fas fa-fire text-gray-300 mb-2 block text-xl"></i>
                        暂无帖子
                    </div>
                `;
                return;
            }
            container.innerHTML = topPosts.map((post, index) => `
                <div class="px-3 py-2 hover:bg-gray-50 rounded-lg cursor-pointer transition-colors" onclick="openPostDetail(${post.id})">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="w-5 h-5 rounded-md ${index === 0 ? 'bg-red-100 text-red-600' : index === 1 ? 'bg-orange-100 text-orange-600' : 'bg-yellow-100 text-yellow-600'} text-xs font-bold flex items-center justify-center">${index + 1}</span>
                        <div class="text-sm font-medium text-gray-800 truncate flex-1">${post.title}</div>
                    </div>
                    <div class="text-xs text-gray-400 pl-7">${post.likes} 赞 · ${post.comments} 评论</div>
                </div>
            `).join('');
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboardList');
            if (!container) return;

            const scores = {};
            posts.forEach(p => {
                if (!p.author_id) return;
                if (!scores[p.author_id]) scores[p.author_id] = { name: p.author, likes: 0, college: p.author_college };
                scores[p.author_id].likes += p.likes || 0;
                scores[p.author_id].name = p.author;
                if (p.author_college) scores[p.author_id].college = p.author_college;
            });
            allComments.forEach(c => {
                if (!c.author_id) return;
                if (!scores[c.author_id]) scores[c.author_id] = { name: c.author, likes: 0, college: c.author_college };
                scores[c.author_id].likes += c.likes || 0;
                scores[c.author_id].name = c.author;
                if (c.author_college) scores[c.author_id].college = c.author_college;
            });

            const topUsers = Object.entries(scores)
                .sort((a, b) => b[1].likes - a[1].likes)
                .slice(0, 3);

            if (topUsers.length === 0) {
                container.innerHTML = `
                    <div class="px-3 py-4 text-center text-gray-400 text-sm">
                        <i class="fas fa-crown text-gray-300 mb-2 block text-xl"></i>
                        暂无数据
                    </div>
                `;
                return;
            }

            container.innerHTML = topUsers.map(([id, user], index) => `
                <div class="flex items-center gap-3 px-2 py-2 hover:bg-gray-50 rounded-lg cursor-pointer transition-colors">
                    <div class="w-8 h-8 rounded-full ${index === 0 ? 'bg-yellow-100 text-yellow-700' : index === 1 ? 'bg-gray-100 text-gray-600' : 'bg-orange-100 text-orange-700'} flex items-center justify-center font-bold text-xs">${index + 1}</div>
                    <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center font-bold text-sm">${user.name ? user.name.charAt(0) : '匿'}</div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium text-gray-800 truncate">${user.name || '匿名'}</div>
                        <div class="text-xs text-gray-400">${user.college ? user.college + ' · ' : ''}获赞 ${user.likes}</div>
                    </div>
                </div>
            `).join('');
        }

        function loginAdmin() {
            const pw = prompt('请输入管理员密码');

            showToast('已退出管理员模式', 'info');
            renderAnnouncements();
            updateAdminUI();

        function updateAdminUI() {
            const adminBtn = document.getElementById('adminAnnounceBtn');
            if (adminBtn) adminBtn.classList.toggle('hidden', !isAdmin);
            const loginBtn = document.getElementById('adminLoginBtn');
            const logoutBtn = document.getElementById('adminLogoutBtn');
            if (loginBtn) loginBtn.classList.toggle('hidden', isAdmin);
            if (logoutBtn) logoutBtn.classList.toggle('hidden', !isAdmin);

        function openAnnouncementEditor() {
            if (!isAdmin) return;
            const titles = announcements.map(a => a.title).join('\n');
            const action = prompt('选择操作：\n1. 新增公告\n2. 删除公告\n3. 修改公告\n\n请输入数字 (1-3)：');
            if (!action) return;
            if (action === '1') {
                const title = prompt('公告标题：');
                if (!title) return;
                const content = prompt('公告内容：');
                if (!content) return;
                const color = prompt('颜色（purple/green/red/blue/yellow）：') || 'purple';
                supabaseClient.from('announcements').insert({ title, content, color }).then(({ error }) => {
                    if (error) showToast('添加失败', 'error');
                    else { showToast('公告已添加', 'success'); loadAnnouncements(); }
                });
            } else if (action === '2') {
                if (announcements.length === 0) { showToast('没有可删除的公告', 'error'); return; }
                const list = announcements.map((a, i) => `${i + 1}. ${a.title}`).join('\n');
                const idx = parseInt(prompt(`要删除哪条？\n${list}`), 10);
                if (isNaN(idx) || idx < 1 || idx > announcements.length) return;
                const id = announcements[idx - 1].id;
                supabaseClient.from('announcements').delete().eq('id', id).then(({ error }) => {
                    if (error) showToast('删除失败', 'error');
                    else { showToast('公告已删除', 'success'); loadAnnouncements(); }
                });
            } else if (action === '3') {
                if (announcements.length === 0) { showToast('没有可修改的公告', 'error'); return; }
                const list = announcements.map((a, i) => `${i + 1}. ${a.title}`).join('\n');
                const idx = parseInt(prompt(`要修改哪条？\n${list}`), 10);
                if (isNaN(idx) || idx < 1 || idx > announcements.length) return;
                const ann = announcements[idx - 1];
                const title = prompt('新标题：', ann.title);
                if (title === null) return;
                const content = prompt('新内容：', ann.content);
                if (content === null) return;
                const color = prompt('颜色（purple/green/red/blue/yellow）：', ann.color) || ann.color;
                supabaseClient.from('announcements').update({ title, content, color }).eq('id', ann.id).then(({ error }) => {
                    if (error) showToast('修改失败', 'error');
                    else { showToast('公告已修改', 'success'); loadAnnouncements(); }
                });
            }
        }

        function createPostHTML(post) {
            const cat = categories[post.category];
            const isMine = post.author_id === getAuthorId();
            const isFavorited = favoritedPostIds.includes(post.id);
            return `
                <article class="post-card bg-white rounded-2xl shadow-sm p-5 cursor-pointer" onclick="openPostDetail(${post.id})">
                    <div class="flex items-start gap-4">
                        <div class="flex-shrink-0">
                            <div class="w-11 h-11 rounded-full ${post.avatarColor} flex items-center justify-center font-bold text-sm">
                                ${post.avatar}
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                                <span class="font-bold text-gray-900 text-sm">${post.author}</span>
                                ${post.is_admin ? '<span class="px-1.5 py-0.5 rounded bg-blue-100 text-blue-600 text-[10px] font-bold">管理员</span>' : ''}
                                ${post.author_college || getGenderSymbol(post.author_gender) ? `<span class="text-xs text-gray-400">${[post.author_college, getGenderSymbol(post.author_gender)].filter(Boolean).join(' · ')}</span>` : ''}
                                <span class="px-2 py-0.5 rounded-lg ${cat.color} text-xs font-medium flex items-center gap-1">
                                    <i class="fas ${cat.icon} text-[10px]"></i> ${cat.name}
                                </span>
                                ${post.isTop ? '<span class="px-2 py-0.5 rounded-lg bg-red-100 text-red-600 text-xs font-medium"><i class="fas fa-thumbtack text-[10px]"></i> 置顶</span>' : ''}
                                ${isMine ? '<span class="px-2 py-0.5 rounded-lg bg-gray-100 text-gray-600 text-xs font-medium">我的</span>' : ''}
                                <span class="text-gray-400 text-xs ml-auto">${post.time}</span>
                            </div>
                            <h3 class="font-bold text-gray-900 mb-2 leading-snug hover:text-purple-700 transition-colors">${post.title}</h3>
                            <p class="text-gray-600 text-sm leading-relaxed line-clamp-2 mb-3">${post.content}</p>
                            <div class="flex items-center gap-5 text-gray-400 text-sm">
                                <button class="like-btn flex items-center gap-1.5 hover:text-red-500 transition-colors ${post.liked ? 'liked' : ''}" onclick="event.stopPropagation(); toggleLike(${post.id})">
                                    <i class="${post.liked ? 'fas' : 'far'} fa-heart"></i>
                                    <span>${post.likes}</span>
                                </button>
                                <span class="flex items-center gap-1.5">
                                    <i class="far fa-comment-alt"></i>
                                    <span>${post.comments}</span>
                                </span>
                                <span class="flex items-center gap-1.5">
                                    <i class="far fa-eye"></i>
                                    <span>${post.views}</span>
                                </span>
                                <button class="flex items-center gap-1.5 hover:text-yellow-500 transition-colors ${isFavorited ? 'text-yellow-500' : ''}" onclick="event.stopPropagation(); toggleFavorite(${post.id})">
                                    <i class="${isFavorited ? 'fas' : 'far'} fa-star"></i>
                                    <span>${isFavorited ? '已收藏' : '收藏'}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }

        // ==================== 交互操作 ====================
        async function toggleLike(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;

            const newLikes = post.liked ? Math.max(0, post.likes - 1) : post.likes + 1;

            const { error } = await supabaseClient.from('posts').update({ likes: newLikes }).eq('id', postId);
            if (error) {
                showToast('操作失败', 'error');
                return;
            }

            post.liked = !post.liked;
            post.likes = newLikes;
            if (post.liked) {
                if (!likedPostIds.includes(postId)) likedPostIds.push(postId);
            } else {
                likedPostIds = likedPostIds.filter(id => id !== postId);
            }
            localStorage.setItem('nku-forum-liked', JSON.stringify(likedPostIds));

            renderPosts();
            renderHotTopics();
            renderLeaderboard();
            if (post.liked) showToast('已点赞', 'success');
        }

        async function toggleCommentLike(commentId, postId) {
            const comment = allComments.find(c => c.id === commentId);
            if (!comment) return;

            const newLikes = comment.liked ? Math.max(0, comment.likes - 1) : comment.likes + 1;
            const { error } = await supabaseClient.from('comments').update({ likes: newLikes }).eq('id', commentId);
            if (error) {
                showToast('操作失败', 'error');
                return;
            }

            comment.liked = !comment.liked;
            comment.likes = newLikes;
            if (comment.liked) {
                if (!likedCommentIds.includes(commentId)) likedCommentIds.push(commentId);
            } else {
                likedCommentIds = likedCommentIds.filter(id => id !== commentId);
            }
            localStorage.setItem('nku-forum-liked-comments', JSON.stringify(likedCommentIds));

            openPostDetail(postId);
            renderPosts();
            renderHotTopics();
            renderLeaderboard();
        }

        async function incrementViews(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            const newViews = (post.views || 0) + 1;
            await supabaseClient.from('posts').update({ views: newViews }).eq('id', postId);
            post.views = newViews;
            renderPosts();
        }

        async function openPostDetail(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            clearReplyState();
            await incrementViews(postId);

            const cat = categories[post.category];
            const detailContent = document.getElementById('detailContent');
            const commenterName = userProfile.name && userProfile.name.trim() ? userProfile.name.trim() : '匿名';
            const commenterChar = commenterName.charAt(0);
            const isMine = post.author_id === getAuthorId();
            const isFavorited = favoritedPostIds.includes(post.id);

            detailContent.innerHTML = `
                <div class="p-6">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-12 h-12 rounded-full ${post.avatarColor} flex items-center justify-center font-bold text-lg">${post.avatar}</div>
                        <div>
                            <div class="font-bold text-gray-900 flex items-center gap-1.5">
                                ${post.author}
                                ${post.is_admin ? '<span class="px-1.5 py-0.5 rounded bg-blue-100 text-blue-600 text-[10px] font-bold">管理员</span>' : ''}
                            </div>
                            <div class="text-xs text-gray-400">${[post.author_college, getGenderSymbol(post.author_gender)].filter(Boolean).join(' · ')}${post.author_college || getGenderSymbol(post.author_gender) ? ' · ' : ''}${post.time}</div>
                        </div>
                        <span class="ml-auto px-2.5 py-1 rounded-lg ${cat.color} text-xs font-medium flex items-center gap-1">
                            <i class="fas ${cat.icon} text-[10px]"></i> ${cat.name}
                        </span>
                    </div>
                    <h2 class="text-xl font-bold text-gray-900 mb-4 leading-snug">${post.title}</h2>
                    <div class="text-gray-700 leading-relaxed mb-6 whitespace-pre-line">${post.content}</div>
                    <div class="flex items-center gap-4 pb-6 border-b border-gray-100">
                        <button onclick="toggleLike(${post.id}); openPostDetail(${post.id})" class="like-btn flex items-center gap-2 px-4 py-2 rounded-xl border transition-all ${post.liked ? 'liked border-red-200 bg-red-50' : 'border-gray-200 hover:border-red-200 hover:bg-red-50'} ${post.liked ? 'text-red-500' : 'text-gray-500'}">
                            <i class="${post.liked ? 'fas' : 'far'} fa-heart"></i>
                            <span class="font-medium">${post.likes} 赞</span>
                        </button>
                        <span class="flex items-center gap-2 text-gray-400 text-sm">
                            <i class="far fa-comment-alt"></i> ${post.comments} 评论
                        </span>
                        <span class="flex items-center gap-2 text-gray-400 text-sm">
                            <i class="far fa-eye"></i> ${post.views} 浏览
                        </span>
                        <button onclick="toggleFavorite(${post.id}); openPostDetail(${post.id})" class="flex items-center gap-2 px-4 py-2 rounded-xl border transition-all ${isFavorited ? 'border-yellow-200 bg-yellow-50 text-yellow-500' : 'border-gray-200 hover:border-yellow-200 hover:bg-yellow-50 text-gray-500'}">
                            <i class="${isFavorited ? 'fas' : 'far'} fa-star"></i>
                            <span class="font-medium">${isFavorited ? '已收藏' : '收藏'}</span>
                        </button>
                        ${isMine || isAdmin ? `<button onclick="event.stopPropagation(); deletePost(${post.id})" class="ml-auto text-red-500 hover:text-red-700 text-sm font-medium"><i class="fas fa-trash-alt mr-1"></i>删除</button>` : ''}
                    </div>
                </div>
                <div class="px-6 pb-6">
                    <h3 class="font-bold text-gray-800 mb-4">评论 (${post.comments})</h3>
                    <div class="space-y-4 mb-6" id="commentList">
                        ${post.commentList.length > 0 ? post.commentList.map(c => `
                            <div class="comment-enter flex gap-3">
                                <div class="w-9 h-9 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center font-bold text-xs flex-shrink-0">${c.author ? c.author.charAt(0) : '匿'}</div>
                                <div class="flex-1 bg-gray-50 rounded-xl rounded-tl-none p-3">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="font-bold text-sm text-gray-800">${c.author || '匿名'}</span>
                                        ${c.is_admin ? '<span class="px-1 py-0.5 rounded bg-blue-100 text-blue-600 text-[10px] font-bold">管理员</span>' : ''}
                                        ${c.author_college || getGenderSymbol(c.author_gender) ? `<span class="text-xs text-gray-400">${[c.author_college, getGenderSymbol(c.author_gender)].filter(Boolean).join(' · ')}</span>` : ''}
                                        <span class="text-xs text-gray-400">${c.time}</span>
                                        <button onclick="event.stopPropagation(); toggleCommentLike(${c.id}, ${post.id})" class="like-btn flex items-center gap-1 text-xs ml-auto ${c.liked ? 'liked text-red-500' : 'text-gray-400 hover:text-red-500'} transition-colors">
                                            <i class="${c.liked ? 'fas' : 'far'} fa-heart"></i>
                                            <span>${c.likes}</span>
                                        </button>
                                    </div>
                                    <p class="text-sm text-gray-600">${c.reply_to_name ? `回复${c.reply_to_name}同学：${c.content}` : c.content}</p>
                                    <button onclick="startReply(${c.id}, '${(c.author || '匿名').replace(/'/g, "\\'")}', ${post.id})" class="text-xs text-purple-600 hover:text-purple-800 mt-1">回复</button>
                                </div>
                            </div>
                        `).join('') : '<p class="text-gray-400 text-sm text-center py-4">暂无评论，快来抢沙发吧！</p>'}
                    </div>
                    <div class="flex gap-3">
                        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xs flex-shrink-0">${commenterChar}</div>
                        <div class="flex-1 flex gap-2">
                            <input type="text" id="commentInput" placeholder="写下你的评论..."
                                class="flex-1 px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-200 focus:border-purple-500 outline-none text-sm"
                                onkeypress="if(event.key==='Enter') submitComment(${post.id})">
                            <button onclick="submitComment(${post.id})" class="px-5 py-2.5 bg-purple-700 text-white rounded-xl hover:bg-purple-800 text-sm font-medium transition-colors">
                                发送
                            </button>
                        </div>
                    </div>
                </div>
            `;

            openModal('detailModal');
            setTimeout(() => {
                const input = document.getElementById('commentInput');
                if (input) input.focus();
            }, 100);
        }

        async function submitComment(postId) {
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            if (!content) {
                showToast('请输入评论内容', 'error');
                return;
            }

            const commenterName = userProfile.name && userProfile.name.trim() ? userProfile.name.trim() : '匿名';

            try {
                const payload = {
                    post_id: postId,
                    author_name: commenterName,
                    author_id: getAuthorId(),
                    author_college: userProfile.college || '',
                    author_gender: userProfile.gender || '',
                    is_admin: isAdmin,
                    content: content
                };
                if (replyingToCommentId && replyingToPostId === postId) {
                    payload.parent_id = replyingToCommentId;
                    payload.reply_to_name = replyingToAuthorName || '匿名';
                }
                let { error } = await supabaseClient.from('comments').insert(payload);
                if (error && error.message) {
                    if (error.message.includes('parent_id')) {
                        delete payload.parent_id;
                    }
                    if (error.message.includes('reply_to_name')) {
                        delete payload.reply_to_name;
                    }
                    if (error.message.includes('parent_id') || error.message.includes('reply_to_name')) {
                        const retry = await supabaseClient.from('comments').insert(payload);
                        error = retry.error;
                    }
                }
                if (error) {
                    showToast('评论失败: ' + error.message, 'error');
                    return;
                }
            } catch (e) {
                console.error('评论异常', e);
                showToast('网络请求失败，请检查控制台错误信息', 'error');
                return;
            }

            input.value = '';
            if (replyingToCommentId && replyingToPostId === postId) {
                clearReplyState();
            }
            showToast('评论发布成功', 'success');
            await loadComments();
            openPostDetail(postId);
            renderPosts();
            renderHotTopics();
            renderLeaderboard();
        }

        async function submitPost() {
            const category = document.getElementById('postCategory').value;
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title) {
                showToast('请输入标题', 'error');
                return;
            }
            if (!content) {
                showToast('请输入内容', 'error');
                return;
            }

            const displayName = userProfile.name && userProfile.name.trim() ? userProfile.name.trim() : '匿名';

            try {
                const { error } = await supabaseClient.from('posts').insert({
                    title: title,
                    content: content,
                    category: category,
                    author_name: displayName,
                    author_id: getAuthorId(),
                    author_college: userProfile.college || '',
                    author_gender: userProfile.gender || '',
                    is_admin: isAdmin,
                    likes: 0,
                    views: 0
                });
                if (error) {
                    showToast('发布失败: ' + error.message, 'error');
                    return;
                }
            } catch (e) {
                console.error('发帖异常', e);
                showToast('网络请求失败，请检查控制台错误信息', 'error');
                return;
            }

            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            closeModal('postModal');
            showToast('帖子发布成功！', 'success');
            await loadPosts();
        }

        async function deletePost(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            if (post.author_id !== getAuthorId() && !isAdmin) {
                showToast('无权删除', 'error');
                return;
            }
            if (!confirm('确定要删除这条帖子吗？')) return;

            try {
                const { error } = await supabaseClient.from('posts').delete().eq('id', postId);
                if (error) {
                    showToast('删除失败: ' + error.message, 'error');
                    return;
                }
            } catch (e) {
                console.error('删除异常', e);
                showToast('网络请求失败', 'error');
                return;
            }

            showToast('帖子已删除', 'success');
            closeModal('detailModal');
            await loadPosts();
        }

        // ==================== 模态框 & Toast ====================
        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
            document.body.style.overflow = '';
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-purple-600'
            };
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            toast.className = `toast ${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-medium`;
            toast.innerHTML = `<i class="fas ${icons[type]}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== 个人信息 ====================
        function openProfileModal() {
            document.getElementById('profileName').value = userProfile.name || '';
            document.getElementById('profileStudentId').value = userProfile.studentId || '';
            document.getElementById('profileCollege').value = userProfile.college || '';
            const genderRadios = document.getElementsByName('profileGender');
            for (let r of genderRadios) {
                r.checked = (r.value === userProfile.gender);
            }
            updateAdminUI();
            openModal('profileModal');
        }

        async function saveProfile() {
            const name = document.getElementById('profileName').value.trim();
            const studentId = document.getElementById('profileStudentId').value.trim();
            const college = document.getElementById('profileCollege').value;
            const genderRadios = document.getElementsByName('profileGender');
            let gender = '';
            for (let r of genderRadios) {
                if (r.checked) gender = r.value;
            }
            if (!name) {
                showToast('请输入姓名', 'error');
                return;
            }
            const oldName = userProfile.name;
            const oldCollege = userProfile.college;
            const oldGender = userProfile.gender;
            const oldAuthorId = getAuthorId();
            userProfile = { name, studentId, college, gender };
            saveLocalProfile();
            const newAuthorId = getAuthorId();

            updateNavAvatar();
            closeModal('profileModal');
            showToast('个人信息保存成功', 'success');

            const needsMigration = oldAuthorId !== newAuthorId;

            if (name !== oldName || college !== oldCollege || gender !== oldGender || needsMigration) {
                const updatePayload = { author_name: name, author_college: college, author_gender: gender };
                if (needsMigration) {
                    updatePayload.author_id = newAuthorId;
                }
                Promise.all([
                    supabaseClient.from('posts').update(updatePayload).eq('author_id', oldAuthorId),
                    supabaseClient.from('comments').update(updatePayload).eq('author_id', oldAuthorId)
                ]).then(() => {
                    if (needsMigration) {
                        posts.forEach(p => { if (p.author_id === oldAuthorId) p.author_id = newAuthorId; });
                        allComments.forEach(c => { if (c.author_id === oldAuthorId) c.author_id = newAuthorId; });
                    }
                    loadPosts();
                }).catch(err => {
                    console.error('同步历史数据失败', err);
                });
            }
        }

        function updateNavAvatar() {
            const navAvatar = document.getElementById('navAvatar');
            const profileAvatar = document.getElementById('profileAvatar');
            const displayName = userProfile.name && userProfile.name.trim() ? userProfile.name.trim() : '匿名';
            const firstChar = displayName.charAt(0);
            if (navAvatar) navAvatar.textContent = firstChar;
            if (profileAvatar) profileAvatar.textContent = firstChar;
        }

        // ==================== 通知 ====================
        function addNotification(type, post, customMessage) {
            const enabled = document.getElementById('notifSetting');
            if (enabled && !enabled.checked) return;
            const notif = {
                id: Date.now(),
                type: type,
                title: post.title,
                postId: post.id,
                time: '刚刚',
                read: false,
                message: customMessage || '回复了你的帖子'
            };
            notifications.unshift(notif);
            renderNotifications();
        }

        function renderNotifications() {
            const list = document.getElementById('notificationList');
            const badge = document.getElementById('notifBadge');
            const unreadCount = notifications.filter(n => !n.read).length;
            if (badge) {
                badge.classList.toggle('hidden', unreadCount === 0);
            }
            if (notifications.length === 0) {
                list.innerHTML = `
                    <div class="px-4 py-8 text-center text-gray-400 text-sm">
                        <i class="far fa-bell text-2xl mb-2 block text-gray-300"></i>
                        暂无通知
                    </div>
                `;
                return;
            }
            list.innerHTML = notifications.map(n => `
                <div class="px-4 py-3 border-b border-gray-50 hover:bg-gray-50 cursor-pointer transition-colors ${n.read ? 'opacity-70' : 'bg-purple-50/30'}" onclick="readNotification(${n.id}, ${n.postId})">
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center flex-shrink-0 mt-0.5">
                            <i class="fas fa-comment-dots text-xs"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm text-gray-800 leading-snug mb-1">
                                <span class="font-bold">有人</span> ${n.message} <span class="font-medium text-purple-700">《${n.title}》</span>
                            </p>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-gray-400">${n.time}</span>
                                ${!n.read ? '<span class="w-2 h-2 bg-red-500 rounded-full"></span>' : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleNotificationPanel() {
            const panel = document.getElementById('notificationPanel');
            notifPanelOpen = !notifPanelOpen;
            panel.classList.toggle('hidden', !notifPanelOpen);
        }

        function readNotification(notifId, postId) {
            const notif = notifications.find(n => n.id === notifId);
            if (notif) {
                notif.read = true;
                renderNotifications();
            }
            if (postId) {
                toggleNotificationPanel();
                openPostDetail(postId);
            }
        }

        function clearAllNotifications() {
            notifications.forEach(n => n.read = true);
            renderNotifications();
            showToast('全部标记为已读', 'success');
        }

        document.addEventListener('click', (e) => {
            const wrapper = document.getElementById('notificationWrapper');
            const panel = document.getElementById('notificationPanel');
            if (notifPanelOpen && wrapper && !wrapper.contains(e.target)) {
                notifPanelOpen = false;
                panel.classList.add('hidden');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal('postModal');
                closeModal('detailModal');
                closeModal('profileModal');
                if (notifPanelOpen) {
                    notifPanelOpen = false;
                    document.getElementById('notificationPanel').classList.add('hidden');
                }
            }
        });
    </script>
</body>
</html>
